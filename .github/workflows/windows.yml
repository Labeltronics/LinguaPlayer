name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install VLC
        run: choco install vlc --yes --no-progress
      - name: Build and test
        shell: pwsh
        run: ./build_windows.ps1
      - name: Disable system VLC to verify portable codecs
        shell: pwsh
        run: Rename-Item "${env:ProgramFiles}\VideoLAN\VLC" "VLC-system-disabled"
      - name: Test packaged EXE startup
        shell: pwsh
        run: |
          $p = Start-Process dist\Cyber80Players\Cyber80Players.exe -ArgumentList '--self-test', "$env:RUNNER_TEMP\lingua-test.json" -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:RUNNER_TEMP\lingua-test.json" -ErrorAction SilentlyContinue
            Get-Content "$env:LOCALAPPDATA\Cyber80 Players\playback.log" -Tail 100 -ErrorAction SilentlyContinue
            throw 'EXE playback self-test failed'
          }
          Get-Content "$env:RUNNER_TEMP\lingua-test.json"
          Copy-Item "$env:RUNNER_TEMP\lingua-test.json" dist\Cyber80Players\HASIL_UJI_WINDOWS.json
      - uses: actions/upload-artifact@v4
        with:
          name: Cyber80Players-Windows-x64
          path: dist/Cyber80Players/
